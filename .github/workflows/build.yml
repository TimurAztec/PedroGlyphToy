name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be used directly in `if:`, so expose a flag instead.
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own release key if the SIGNING_* secrets are set.
      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk pedro-glyph-toy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pedro-glyph-toy
          path: pedro-glyph-toy.apk

      # Pushing a tag like v1.0 publishes a GitHub Release with the APK attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pedro-glyph-toy.apk
          generate_release_notes: true
